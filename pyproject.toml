[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimic"
version = "0.1.0"
description = "Convert MP4 video of a person into glTF/GLB 3D animations using a Mixamo-compatible skeleton"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ABADLI Badreddine" }]
dependencies = [
    "mediapipe>=0.10",
    "numpy>=1.24",
    "pygltflib>=1.16",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "matplotlib>=3.7",
]

[project.scripts]
mimic = "interfaces.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
