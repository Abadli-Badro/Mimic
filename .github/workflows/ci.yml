name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/output/matplotlib
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgles2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" opencv-python

      - name: Check MediaPipe native runtime
        run: >-
          python -c "import mediapipe as mp; import numpy as np;
          image = mp.Image(image_format=mp.ImageFormat.SRGB, data=np.zeros((32, 32, 3), dtype=np.uint8));
          print('MediaPipe native image runtime loaded successfully')"

      - name: Check CLI entry point
        run: |
          mimic --help
          mimic run --help

      - name: Run tests
        run: python -m pytest -q -ra
